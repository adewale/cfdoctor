name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill, evals, and scanner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv (for npm run eval:validate)
        uses: astral-sh/setup-uv@v9.0.0

      # package.json is the single source of truth for the gate: CI runs the same
      # `npm test` maintainers run locally (JSON validation, py_compile, unit tests,
      # trigger eval, self-scan, detection eval, coverage matrix, evidence ledger,
      # link policy, install boundary).
      - name: Run npm test
        run: npm test

      - name: Validate shared benchmark with Skill Eval Harness v0.6.0
        run: npm run eval:validate

      - name: Check whitespace in committed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA"...HEAD
