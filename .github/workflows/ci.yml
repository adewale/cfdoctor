name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill, evals, and scanner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv (for npm run eval:validate)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # package.json is the single source of truth for the gate: CI runs the same
      # `npm test` maintainers run locally (JSON validation, py_compile, unit tests,
      # trigger eval, self-scan, detection eval, coverage matrix, evidence ledger,
      # link policy, install boundary).
      - name: Run npm test
        run: npm test

      - name: Validate shared benchmark with Skill Eval Harness v0.6.0
        run: npm run eval:validate

      - name: Check whitespace in committed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA"...HEAD
