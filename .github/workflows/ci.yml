name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill, evals, and scanner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON manifests
        run: |
          python3 -m json.tool package.json >/dev/null
          find evals -name '*.json' -print0 | xargs -0 -I{} python3 -m json.tool {} >/dev/null

      - name: Compile Python helpers
        run: python3 -m py_compile skills/cloudflare-doctor/scripts/cfdoctor_static_scan.py scripts/eval_skill_trigger.py scripts/eval_detection.py scripts/check_coverage.py scripts/check_links.py scripts/check_install_boundary.py

      - name: Run trigger eval
        run: python3 scripts/eval_skill_trigger.py --out-dir /tmp/cfdoctor-trigger-eval

      - name: Run static self-scan (fixtures excluded, must be clean)
        run: |
          ./skills/cloudflare-doctor/scripts/cfdoctor_static_scan.py . --exclude evals/fixtures --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); f=d['findings']; assert not f, f; print('self-scan clean')"

      - name: Run detection eval against fixtures
        run: python3 scripts/eval_detection.py --out-dir /tmp/cfdoctor-detection-eval

      - name: Check coverage matrix consistency
        run: python3 scripts/check_coverage.py

      - name: Check whitespace in diff
        run: git diff --check -- . ':(exclude)evals/results'
