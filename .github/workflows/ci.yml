name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill, evals, and scanner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up uv (for npm run eval:validate)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # package.json is the single source of truth for the gate: CI runs the same
      # `npm test` maintainers run locally (JSON validation, py_compile, unit tests,
      # trigger eval, self-scan, detection eval, coverage matrix, evidence ledger,
      # link policy, install boundary).
      - name: Run npm test
        run: npm test

      - name: Validate shared benchmark with Skill Eval Harness v0.6.0
        run: npm run eval:validate

      - name: Check whitespace in committed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA"...HEAD
